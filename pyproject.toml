[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bdh-app-device-control"
version = "1.0.1"
description = "Black Diamond Hub app: lodge device controls (lights, blinds, fireplace, Gemstone Lights) via Home Assistant"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "bdh-sdk[ha]>=0.2,<1",
    "pygemstone>=0.0.3",
]

[project.urls]
Source = "https://github.com/blackdiamondlodge/bdh-app-device-control"

[project.entry-points."blackdiamondhub.plugins"]
device_control = "device_control.plugin:spec"

[tool.setuptools.packages.find]
include = ["device_control", "device_control.*"]

[tool.setuptools.package-data]
device_control = [
    "templates/**/*",
    "static/**/*",
    "migrations/*.py",
]
